#################
### GAMING ###
#################

# Solo juegos reales (Proton/Steam vía Lutris u otro launcher).
# Lutris, Grok Bot, Kitty, Brave, etc. NO entran aquí.
# El juego abre en el workspace/monitor donde lo lanzas; si pide fullscreen, Hyprland lo respeta.
# confine_pointer evita que el ratón se escape al otro monitor en fullscreen.

windowrule {
    name = game-steam-proton
    match:class = ^(steam_app_.*)$

    content = game
    sync_fullscreen = true
    idle_inhibit = fullscreen
}

# Si el juego ya está a pantalla completa, confina el cursor
windowrule {
    name = game-confine-pointer
    match:content = game
    match:fullscreen = true

    confine_pointer = true
}

# No robes el foco de un fullscreen por apps que piden activate debajo
misc {
    on_focus_under_fullscreen = 0
}
